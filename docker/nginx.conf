server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Revalidate HTML and unversioned public files after each deployment.
	# This also covers index.html served through the client-side route fallback.
	add_header Cache-Control "no-cache" always;

	# This file stays available when the backend is down. Atomic backend writes
	# publish a new version into the shared volume without rebuilding this image.
	location = /items-snapshot.json {
		root /var/cache/inventory-snapshots;
		try_files $uri @bundled_inventory_snapshot;
		default_type application/json;
		add_header Cache-Control "no-store" always;
	}
	location @bundled_inventory_snapshot {
		root /usr/share/nginx/html;
		try_files /items-snapshot.json =503;
		default_type application/json;
		add_header Cache-Control "no-store" always;
	}

	# Client-side routing (react-router-dom): unknown paths fall back to index.html.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
