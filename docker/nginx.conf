server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Revalidate HTML and unversioned public files after each deployment.
	# This also covers index.html served through the client-side route fallback.
	add_header Cache-Control "no-cache" always;

	# Client-side routing (react-router-dom): unknown paths fall back to index.html.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
